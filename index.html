top:2px}.disabled{opacity:.45}.disabled .sets{display:none}.disabled details{display:none}.subtext{margin-top:8px;font-size:13px;color:var(--orange)}.log{margin-top:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.log label{font-size:12px;color:var(--muted)}.log input{display:block;width:100%;margin-top:5px;background:#180f27;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;font-size:15px}.log-note{color:var(--muted);font-size:12px;margin-top:9px}.core{font-size:11px;color:var(--mint);margin:0 0 5px}.history{background:#2a1a3a;border:1px solid var(--line);border-radius:14px;padding:15px;margin:18px 0}.history h3{margin:0 0 8px}.history p{margin:4px 0;font-size:13px}@media(max-width:500px){.wrap{padding:20px 14px 55px}.tabs{gap:7px}.tab{padding:14px 8px}.tab.active{padding:13px 7px}.tab strong{font-size:15px}.tab span{font-size:11px}.head h2{font-size:24px}}

</style></head><body><main class="wrap"><header><div class="brand">FORMA</div><div class="tag">18 TRENINGÓW · ♥ ULUBIONE</div></header><div class="alert"><b>Uwaga na stopę:</b> dopóki boli przy chodzeniu, unikaj obciążających ją ćwiczeń i skonsultuj uraz.</div><label class="toggle"><input id="clearance" type="checkbox"><span>Po ocenie urazu mogę bez bólu obciążać stopę — pokaż plan docelowy.</span></label><p class="small">HARD = większy wysiłek, nie trudniejsza technika. Zostaw 2–3 powtórzenia w zapasie.</p><div class="controls"><button id="random" class="btn primary">✦ Losuj wariant w tym dniu</button></div><div class="tabs" id="tabs"></div><div class="controls" id="variants" aria-label="Wybór wariantu"></div><div class="head"><div><h2 id="name"></h2><div class="small" id="subtitle"></div></div></div><div id="exercise-list"></div><div class="footerbox" id="tip"></div></main><script>
const E=(name,sets,reps,rest,how,avoid,blocked=false,alternative='')=>({name,sets,reps,rest,how,avoid,blocked,alternative});
const basePlans=[{name:'Dzień 1',sub:'SIŁOWNIA · nogi + pośladki + brzuch · 50–65 min',tip:'Zacznij od 5 minut łagodnego ruchu, który nie nasila bólu. Po dopuszczeniu stopy: orbitrek 8–15 min na końcu, lekki opór. Nie trenuj przez ból. Ćwicz 2 serie na początku, docelowo zgodnie z planem.',ex:[
E('Prostowanie nóg siedząc',3,'10–12','75 s','Dostosuj oparcie i oś maszyny do kolana. Wyprostuj nogi bez szarpania, powoli wróć.','Przerwij przy bólu w stopie od poduszki lub przy ustawianiu nogi.'),
E('Uginanie nóg siedząc',3,'10–12','75 s','Ustabilizuj biodra, ugnij nogi płynnie w kolanach i wolno oddawaj ciężar.','Nie wykonuj, jeśli wałek uciska bolesne miejsce stopy.'),
E('Hip thrust na maszynie',3,'8–12','90 s','Plecy stabilnie oparte, wypchnij biodra w górę, zakończ ruchem pośladków, bez przeprostu lędźwi.','Duży nacisk stóp — wyłącznie po dopuszczeniu do obciążenia.',true,'Na razie pomiń; nie zastępuj ruchem powodującym nacisk na stopę.'),
E('Wiosłowanie z podparciem klatki',2,'10–12','75 s','Oprzyj klatkę o poduszkę. Prowadź łokcie w tył, barki z dala od uszu, powoli oddaj ciężar.','Nie zaciskaj szyi i szczęki.'),
E('Dead bug',3,'8 na stronę','45 s','Leżąc na plecach, powoli prostuj przeciwną rękę i nogę; utrzymuj wygodną pozycję miednicy i oddychaj.','Zmniejsz zakres, jeśli czujesz plecy.'),
E('Reverse crunch',2,'10–12','60 s','Leżąc, z ugiętymi kolanami delikatnie unieś miednicę dzięki brzuchowi, nie zamachowi nóg.','Pomiń, jeśli powoduje ból pleców.')
]},{name:'Dzień 2',sub:'SIŁOWNIA · uda + biodra + talia · 50–65 min',tip:'Po ocenie stopy można dodać orbitrek 8–15 min bez bólu. Między dniami siłowymi zachowaj co najmniej 48 godzin przerwy. Talia: ćwiczenia ją wzmacniają, ale nie spalają tłuszczu miejscowo.',ex:[
E('Suwnica na nogi',3,'8–12','120 s','Plecy i miednica przylegają do oparcia. Ugnij kolana kontrolowanie, następnie wypchnij platformę bez blokowania kolan.','Wymaga dużego nacisku stóp — zacznij dopiero po dopuszczeniu.',true,'Teraz: prostowanie nóg siedząc, tylko bez bólu.'),
E('Odwodzenie nóg siedząc',3,'12–15','60 s','Usiądź stabilnie, rozchylaj kolana bez kołysania tułowiem, wolno wracaj.','Nie dociskaj chorej stopy do podparcia.'),
E('Glute bridge',3,'10–12','75 s','Leżąc z kolanami ugiętymi unieś biodra przez napięcie pośladków, bez wyginania lędźwi.','Obciąża stopy — dopiero po dopuszczeniu.',true,'Na razie pomiń.'),
E('Ściąganie drążka neutralnie',2,'10–12','75 s','Ściągaj uchwyty ku górnej części klatki, prowadząc łokcie w dół; nie odchylaj gwałtownie pleców.','Nie napinaj szyi.'),
E('Deska boczna na kolanach',3,'20–30 s / bok','45 s','Oprzyj przedramię i ugięte kolana, unieś biodra i oddychaj normalnie.','Zatrzymaj, jeśli bolą barki lub plecy.'),
E('Open book — rotacje piersiowe',2,'6–8 / bok','30 s','Leżąc na boku z kolanami ugiętymi, powoli otwórz górną rękę w tył, podążaj wzrokiem, bez forsowania.','Ruch ma być łagodny i bezbolesny.')
]},{name:'Dom!',sub:'DOM · brzuch + pośladki + rozluźnienie · 25–35 min',tip:'W domu nie potrzebujesz sprzętu. To trening dodatkowy, a nie obowiązkowy trzeci intensywny dzień. Zakończ 2–3 minutami spokojnego oddychania.',ex:[
E('Dead bug',3,'8 / stronę','40 s','Leżąc na plecach z kolanami nad biodrami, opuszczaj przeciwną rękę i nogę powoli, bez utraty kontroli tułowia.','Bez bólu pleców.'),
E('Clamshell — muszla',3,'12–15 / bok','45 s','Leżąc na boku z ugiętymi nogami i piętami razem, unieś górne kolano bez obracania miednicy. Podgląd pokazuje pokrewne odwodzenie nogi bokiem, nie identyczną muszlę.','Jeśli zetknięcie stóp boli, rozdziel je miękkim ręcznikiem lub pomiń.'),
E('Unoszenie nogi bokiem leżąc',2,'12 / bok','45 s','Leżąc na boku unieś wyprostowaną górną nogę niedużym ruchem bez skręcania tułowia.','Bez dolegliwości stopy lub biodra.'),
E('Deska boczna na kolanach',2,'20–30 s / bok','45 s','Przedramię pod barkiem, biodra w górę, tułów w jednej linii.','Nie zaciskaj szyi.'),
E('Open book',2,'6–8 / bok','30 s','Powolna rotacja górnej części tułowia w leżeniu na boku, z naturalnym oddechem.','Bez forsowania zakresu.'),
E('Spokojny oddech',1,'3 minuty','—','Wygodnie usiądź lub połóż się. Oddychaj spokojnie, z nieco dłuższym wydechem, bez wstrzymywania i bez wysiłku.','Przerwij, jeśli pojawia się zawroty głowy.')
]}];

// 3 warianty dla każdej lokalizacji; wariant A wykorzystuje bazowy zestaw.
// Każdy dzień ma niezmienny rdzeń ćwiczeń. Losowane są tylko dodatki.
const catalog = new Map();
for (const p of basePlans) for (const e of p.ex) catalog.set(e.name,e);
const additions=[
 E('Pallof press na wyciągu',2,'10 / stronę','60 s','Stań stabilnie i wypchnij uchwyt przed siebie, nie obracaj tułowia.','Dopiero po ocenie stopy; wymaga stania.',true,'Wybierz dead bug.'),
 E('Goblet squat do ławki',3,'8–10','120 s','Usiądź wolno do ławki i wstań z równomiernym oparciem stóp.','Dopiero po ocenie stopy.',true,'Pomiń do czasu dopuszczenia.'),
 E('Bird dog',2,'8 / stronę','45 s','W klęku podpartym wyciągnij przeciwną rękę i nogę, bez odchylania miednicy.','Nie opieraj bolesnych palców o podłoże.'),
 E('Spokojny oddech',1,'3 min','—','Spokojny wdech i nieco dłuższy wydech, bez forsowania.','Przerwij przy zawrotach głowy.'),
 E('Clamshell — muszla',2,'12–15 / bok','45 s','Leżąc bokiem unieś kolano bez skręcania bioder. Film pokazuje podobne odwodzenie wyprostowanej nogi.','Nie uciskaj bolesnej stopy.'),
 E('Unoszenie nogi bokiem leżąc',2,'12 / bok','45 s','Unieś górną nogę przy nieruchomej miednicy.','Tylko bez bólu.'),
 E('Deska boczna na kolanach',2,'20–30 s / bok','45 s','Oprzyj przedramię i kolana, unieś biodra.','Przerwij, gdy boli bark lub plecy.'),
 E('Open book',2,'6–8 / bok','30 s','Leżąc bokiem obracaj powoli górną część pleców.','Nie forsuj zakresu.'),
 E('Ściąganie drążka neutralnie',2,'10–12','75 s','Łokcie prowadź w dół, barki z dala od uszu.','Bez napinania szyi.'),
 E('Odwodzenie nóg siedząc',3,'12–15','60 s','Rozchylaj kolana bez kołysania tułowiem.','Nie naciskaj bolesną stopą na podpórkę.'),
 E('Suwnica na nogi',3,'8–12','120 s','Wypychaj platformę z podpartymi plecami, bez odrywania miednicy.','Dopiero po ocenie stopy.',true,'Pomiń do czasu dopuszczenia.'),
 E('Hip thrust na maszynie',3,'8–12','90 s','Unieś biodra napinając pośladki bez przeprostu pleców.','Dopiero po ocenie stopy.',true,'Pomiń do czasu dopuszczenia.')
];
for (const e of additions) if (!catalog.has(e.name)) catalog.set(e.name,e);
const hardAdditions=[
 E('Martwy ciąg rumuński z hantlami',3,'8–10','120 s','Lekko ugnij kolana, cofnij biodra, trzymaj hantle blisko nóg i wstań pracą bioder.','Obciąża stopy i wymaga kontroli tułowia; tylko po ocenie urazu.',true,''),
 E('Przysiad bułgarski',3,'8 na nogę','120 s','Tylna stopa na niskim podparciu; opuszczaj biodra pionowo, utrzymuj kontrolę kolana.','Duże obciążenie stopy i równowagi; tylko po ocenie urazu.',true,''),
 E('Wykroki w tył',3,'10 na nogę','90 s','Zrób kontrolowany krok w tył, obniż biodra i wróć. Kolano nogi podporowej w linii ze stopą.','Wymaga bezbolesnego chodu i obciążania stopy.',true,''),
 E('Przysiad do krzesła',3,'12–15','75 s','Usiądź powoli na stabilnym krześle i wstań, zachowując ciężar nad stopami.','Wykonuj tylko po dopuszczeniu obciążania stopy.',true,''),
 E('Wall sit — siad przy ścianie',3,'30–45 s','60 s','Oprzyj plecy o ścianę, ugnij kolana do wygodnego kąta i oddychaj.','Obciąża stopę; wstrzymaj do oceny urazu.',true,''),
 E('Wspięcia na palce',3,'12–15','60 s','Powoli unieś pięty i kontrolowanie opuść, w razie potrzeby trzymaj się stabilnego podparcia.','Nie wykonywać przy aktualnym bólu bocznej części stopy.',true,''),
 E('Plank na przedramionach',3,'25–45 s','60 s','Łokcie pod barkami, tułów w linii, oddychaj i nie zapadaj się w lędźwiach.','Podparcie na palcach może prowokować ból stopy.',true,''),
 E('Spięcia brzucha leżąc',3,'12–15','60 s','Delikatnie unieś górny odcinek pleców, bez szarpania głową i szyją.','Przerwij gdy zwiększa ból górnych pleców.'),
 E('Unoszenie bioder jednonóż',3,'8–10 na nogę','75 s','Z pozycji leżącej unoś biodra, opierając jedną stopę, bez rotacji miednicy.','Duże obciążenie pojedynczej stopy — wyłącznie po ocenie urazu.',true,''),
];
for(const e of hardAdditions)catalog.set(e.name,e);
const get=n=>{if(!catalog.has(n)) throw Error('Brak ćwiczenia: '+n);return {...catalog.get(n)}};
// Każdy wariant to osobny zestaw; podobne wzorce powracają dla progresji.
const extra=[
 E('Wyciskanie na maszynie siedząc',2,'8–12','90 s','Ustaw siedzenie, prowadź uchwyty do przodu bez unoszenia barków.','Bez bólu pleców.'),
 E('Wyciskanie hantli leżąc',2,'8–12','90 s','Łopatki oparte, hantle prowadź stabilnie i spokojnie.','Bez bólu barków.'),
 E('Wyciskanie hantli siedząc z podparciem',2,'8–10','90 s','Trzymaj tułów przy oparciu, nie unoś barków.','Zrezygnuj, jeśli nasila napięcie szyi.'),
 E('Wiosłowanie na wyciągu siedząc',2,'10–12','75 s','Przyciągnij uchwyt do tułowia bez zarzucania plecami.','Nie napinaj szyi.'),
 E('Przysiad sumo z hantlem',3,'8–12','120 s','Stań szerzej, ugnij kolana zgodnie z kierunkiem stóp.','Wymaga pełnego powrotu do obciążania stopy.',true),
 E('Step-up na stopień',3,'8 na nogę','90 s','Wejdź na stabilne podwyższenie kontrolując kolano.','Wymaga bezbolesnego obciążania stopy.',true),

 E('Pompki przy ścianie',2,'10–15','60 s','Oprzyj dłonie o ścianę, ugnij i wyprostuj ramiona.','Wykonuj bez bolesnego nacisku na stopę.'),
 E('Unoszenie wyprostowanej nogi leżąc',3,'10 na stronę','60 s','Połóż się na plecach, unieś prostą nogę bez szarpnięć.','Nie kontynuuj przy bólu biodra lub pleców.'),
 E('Unoszenie kolan leżąc',3,'12','60 s','Przyciągaj kolana do klatki lekko unosząc miednicę.','Nie szarp szyi i pleców.'),
 E('Przysiad z gumą',3,'10–15','90 s','Z gumą nad kolanami wykonaj kontrolowany przysiad.','Dopiero po dopuszczeniu do obciążania stopy.',true),
 E('Monster walk z gumą',3,'12 kroków','60 s','W półprzysiadzie wykonuj krótkie kroki z oporem gumy.','Wstrzymaj przy bólu stopy.',true),
 E('Wykrok boczny',3,'8 na nogę','90 s','Przenieś biodra w bok, drugą nogę utrzymuj wyprostowaną.','Dopiero po pełnym powrocie do obciążania.',true),

const videoMarkup=(name,j)=>{const sources=media[name]||[];

const attachVideos=()=>{document.querySelectorAll('.preview-mp4').forEach(box=>{const name=decodeURIComponent(box.dataset.mediaName),urls=media[name]||[],v=box.querySelector('video');if(!v)return;
 let i=0;
 const next=()=>{box.hidden=true;if(i>=urls.length){v.removeAttribute('src');box.hidden=false;box.innerHTML='<div class="video-missing">Brak dostępnego nagrania</div>';return;}v.src=urls[i].startsWith("https://")?urls[i++]:cdn+urls[i++];v.load();};
 v.addEventListener('error',next);
 v.addEventListener('loadeddata',()=>{box.hidden=false;v.play().catch(()=>{v.controls=true})});
 next();
 });};
